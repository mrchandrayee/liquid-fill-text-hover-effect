<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#090914">
  <title>Liquid Fill Text Hover Effect</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="page">
    <h1>Liquid Fill Text Hover Effect</h1>
    <section class="demo-area" aria-label="Interactive liquid text demo">
      <div class="perspective-container">
        <button class="liquid-text" type="button" aria-label="Hover or focus to fill the word Liquid">
          LIQUID
        </button>
      </div>
      <p class="hint">Hover over the text</p>
    </section>
    <footer>CSS TEXT HOVER EXPERIMENT</footer>
  </main>
  <script src="script.js"></script>
</body>
</html>
